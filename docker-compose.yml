services:
  fuel-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: vicomsat-fuel-denoising:local
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-sqlite:////app/fuel_data/fuel_records.db}"
      REQUIRE_API_KEY: "${REQUIRE_API_KEY:-false}"
      API_KEY: "${API_KEY:-vicomsat_secret_key_2026}"
      STATE_BACKEND: "${STATE_BACKEND:-memory}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
      STATE_TTL_SECONDS: "${STATE_TTL_SECONDS:-259200}"
    volumes:
      - ./fuel_data:/app/fuel_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
