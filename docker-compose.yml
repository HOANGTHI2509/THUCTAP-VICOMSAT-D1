# =====================================================================
# DOCKER COMPOSE CHO HỆ THỐNG LỌC NHIÊN LIỆU AI VICOMSAT
# =====================================================================
version: "3.8"

services:
  fuel-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vicomsat_fuel_service
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      # Lưu trữ bền vững file CSDL SQLite nếu không dùng server DB ngoài
      - ./fuel_data:/app/fuel_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
